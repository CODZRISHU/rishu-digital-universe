[build]
  base = "."
  publish = "apps/web/dist"
  command = "npm --workspace=packages/shared-types run build && npm --workspace=apps/web run build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_VERSION = "20"