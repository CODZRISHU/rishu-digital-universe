version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rishu-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=rishu_universe

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: rishu-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/rishu_universe
      - JWT_SECRET=super_secret_jwt_access_key_change_in_production_min32chars
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: rishu-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo_data:
